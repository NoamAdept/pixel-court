name: Morning WhatsApp recap

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC = 09:00 Israel (winter) / 10:00 (summer)
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send recap
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python scripts/whatsapp_recap.py
