name: Morning NBA recap

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC = 09:00 Israel (winter) / 10:00 (summer)
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pywebpush==2.0.3
      - name: Push recap to phones
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
        run: python scripts/morning_recap.py
